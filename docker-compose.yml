services:
  db:
    image: postgres:16
    container_name: reellora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      - reellora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    container_name: reellora-redis
    restart: always
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - reellora-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    image: reellora-api-monorepo:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: reellora-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - reellora-net
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const socket=net.connect(Number(process.env.PORT || 3000),'127.0.0.1',()=>socket.end());socket.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: reellora-web-monorepo:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: reellora-web
    restart: unless-stopped
    environment:
      NUXT_API_BASE: http://api:3000
      HOST: 0.0.0.0
      PORT: 3500
    ports:
      - "3500:3500"
    depends_on:
      - api
    networks:
      - reellora-net
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const socket=net.connect(3500,'127.0.0.1',()=>socket.end());socket.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  reellora-net:
    driver: bridge

volumes:
  postgres-data:
